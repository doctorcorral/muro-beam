name: agda

on:
  push:
    branches: [main]
  pull_request:

jobs:
  agda:
    name: agda ${{ matrix.version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # v2.7.0 published no Linux binary. v2.7.0.1 is that leg.
          - version: "2.8.0"
            tag: "v2.8.0"
            asset: "Agda-v2.8.0-linux.tar.xz"
          - version: "2.7.0.1"
            tag: "v2.7.0.1"
            asset: "Agda-v2.7.0.1-linux.tar.xz"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      # Extract outside the repo: the tarball's `agda` binary collides with
      # the `agda/` source directory (tar exits 2).
      - name: Install Agda ${{ matrix.version }}
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          asset="${{ matrix.asset }}"
          curl -fL --retry 5 -o "$tmp/$asset" \
            "https://github.com/agda/agda/releases/download/${{ matrix.tag }}/${asset}"
          tar -xJf "$tmp/$asset" -C "$tmp"
          mkdir -p "$HOME/.local/bin"
          install -m 0755 "$tmp/agda" "$HOME/.local/bin/agda"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/agda" --version
          "$HOME/.local/bin/agda" --setup

      - name: Fetch Agda standard library 2.3
        run: git clone --depth 1 --branch v2.3 https://github.com/agda/agda-stdlib.git vendor/agda-stdlib

      - name: Run make agda
        run: make agda

      - name: Run make audit
        run: make audit
